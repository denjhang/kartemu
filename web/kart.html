<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
// 官方视距: TrackObject camera far=400 + 线性雾 0.5~1.0xfar(UNDERSTOOD §27)
// 官方雾色 r184 g224 b255(TrackObject fog XML)——淡蓝白大气雾, 与天色区分, 远处地面读作雾而非天空
scene.fog = new THREE.Fog(0xb8e0ff, 200, 400);
// near=0.5(勿改小): 太小的 near 会让远处 24bit 深度精度不足, 路面/草地间距 0.03 会 Z-fight 闪烁
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 400);
const controls = new OrbitControls(camera, renderer.domElement);
window.__cam = camera; window.__controls = controls; window.__scene = scene;

// ---- 视角选择: 各模式只驱动 controls.target(注视点), 机位始终可鼠标调整 ----
let camMode = 'follow';
// 跟随模式: 相机锁定车头方向(原版语义), 鼠标拖动只改相对偏移(相对车尾的方位角/俯仰/距离)
const followCam = { yawOff: 0, pitch: 0.38, dist: 7.5 };
let followDrag = null;
renderer.domElement.addEventListener('mousedown', e => {
  if (camMode === 'follow') followDrag = { x: e.clientX, y: e.clientY };
});
addEventListener('mouseup', () => followDrag = null);
addEventListener('mousemove', e => {
  if (camMode !== 'follow' || !followDrag) return;
  followCam.yawOff -= (e.clientX - followDrag.x) * 0.005;   // 拖左→绕到左侧
  followCam.pitch = Math.min(1.25, Math.max(0.05,
    followCam.pitch + (e.clientY - followDrag.y) * 0.005));
  followDrag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
  if (camMode === 'follow')
    followCam.dist = Math.min(20, Math.max(3, followCam.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: true });

document.querySelectorAll('input[name=cam]').forEach(r => r.onchange = e => {
  if (!e.target.checked) return;
  camMode = e.target.value;
  controls.enabled = camMode !== 'follow';   // 跟随模式自己接管相机
  if (!kartRoot) return;
  const p = kartRoot.position, f = drive.heading;   // 前向 = (sin f, cos f)
  if (camMode === 'cockpit') {
    camera.position.set(p.x + Math.sin(f) * 0.5, 2.35, p.z + Math.cos(f) * 0.5);
    controls.target.set(p.x + Math.sin(f) * 8, 1.4, p.z + Math.cos(f) * 8);
  } else if (camMode === 'top') {
    camera.position.set(p.x, 25, p.z + 0.01);
    controls.target.set(p.x, 0, p.z);
  } else if (camMode === 'free') {
    controls.target.set(p.x, 1, p.z);
  }
  if (camMode === 'follow') Object.assign(followCam, { yawOff: 0, pitch: 0.38, dist: 7.5 });
  else controls.update();
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.0));
// 草地+网格合一(单层不透明 shader): 远处线条淡出为纯草地,
// 避免双平面远距 Z-fight 闪烁与网格摩尔纹; 手动雾(ShaderMaterial 不吃 scene.fog)
const gridMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(30000, 30000),
  new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vWP; void main(){vec4 w=modelMatrix*vec4(position,1.);vWP=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader: `
      varying vec3 vWP;
      void main(){
        // 雾距/线淡出必须用相机实时位置(cameraPosition 内置 uniform),
        // 锚定固定点会导致开远后整片地面被画成 100% 雾色
        float d=length(vWP.xz - cameraPosition.xz);
        vec2 c=vWP.xz/2.;
        vec2 g=abs(fract(c-.5)-.5)/fwidth(c);
        float l=min(g.x,g.y);
        float a=1.-min(l,1.);
        float fade=1.-smoothstep(40.,150.,d);
        vec3 grass=vec3(.353,.659,.263);
        vec3 line =vec3(.08,.28,.06);
        vec3 col=mix(grass,line,a*fade);
        float fd=smoothstep(200.,400.,d);
        col=mix(col,vec3(.7216,.8784,1.),fd);
        gl_FragColor=vec4(col,1.);
      }`,
    side: THREE.DoubleSide,
  }));
gridMesh.rotation.x = -Math.PI / 2;
gridMesh.position.y = -0.01;
scene.add(gridMesh);

// ---- 测试场景装饰: 跑道/车道线/围栏/树/房屋/远山 (程序化生成) ----
const scenery = new THREE.Group();
scene.add(scenery);
// 场景实体碰撞体(树/房屋, {x,z,r} 圆近似)
const solidColliders = [];
const lambert = c => new THREE.MeshLambertMaterial({ color: c });
// ---- 真实地图: 城镇高速公路官方路线(tools/export_route.py 从 track.1s 导出) ----
// route.json: 官方 ToRoad frames, D->P 换算, 10u 重采样, 378 帧环形, 圈长 3780
// 高程压缩 0.25(官方 27~82 爬坡, 压到 0~14; 路肩做成随路堤岸)
const ROUTE = await (await fetch('track/route.json')).json();
{
  let yMin = Infinity;
  for (const f of ROUTE.frames) yMin = Math.min(yMin, f.p[1]);
  for (const f of ROUTE.frames) f.p[1] = (f.p[1] - yMin) * 0.25;
}
const FR = ROUTE.frames;
const ROAD_HALF = 10;                 // 路宽 20(官方门短边), 半宽 10
// 路肩高程: |lat|<=10 为路面; 10~100 线性回落到草地
function shoulderK(lat) {
  const a = Math.abs(lat);
  return a <= ROAD_HALF ? 1 : Math.max(0, 1 - (a - ROAD_HALF) / 90);
}
// 横向单位向量(水平, 垂直于前向)
const latRight = f => [-f[2], f[0]];

// 路面带(环形 ribbon): 每帧左右各一顶点
{
  const pos = [], idx = [];
  const N = FR.length;
  for (let i = 0; i < N; i++) {
    const f = FR[i], r = latRight(f.f);
    pos.push(f.p[0] - r[0] * ROAD_HALF, f.p[1] + 0.05, f.p[2] - r[1] * ROAD_HALF,
             f.p[0] + r[0] * ROAD_HALF, f.p[1] + 0.05, f.p[2] + r[1] * ROAD_HALF);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = i * 2 + 1, c = ((i + 1) % N) * 2, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  scenery.add(new THREE.Mesh(geo, lambert(0x3a3f44)));
}
// 路肩堤岸(左右各一条, 草色, 从路缘回落到草地): 横向 [10,20,35,60,100], 高度系数 [1,.85,.6,.3,0]
{
  const OFFS = [10, 20, 35, 60, 100];
  for (const side of [1, -1]) {
    const pos = [], idx = [];
    const N = FR.length, M = OFFS.length;
    for (let i = 0; i < N; i++) {
      const f = FR[i], r = latRight(f.f);
      for (const off of OFFS) {
        const k = shoulderK(side * off);
        pos.push(f.p[0] + r[0] * off * side, f.p[1] * k, f.p[2] + r[1] * off * side);
      }
    }
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < M - 1; j++) {
        const a = i * M + j, b = a + 1, c = ((i + 1) % N) * M + j, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    scenery.add(new THREE.Mesh(geo, lambert(0x4f9640)));
  }
}
// 路肩高程(车跟随): |lat|<=10 -> 路面高; 以外按堤岸系数回落
function routeGroundY(x, z, ni) {
  const fr = FR[ni], nxt = FR[(ni + 1) % FR.length];
  const dx = x - fr.p[0], dz = z - fr.p[2];
  const t = Math.max(0, Math.min(1, (dx * fr.f[0] + dz * fr.f[2]) / ROUTE.spacing));
  const ry = fr.p[1] + (nxt.p[1] - fr.p[1]) * t;
  const rx = -fr.f[2], rz = fr.f[0];
  const lat = Math.abs(dx * rx + dz * rz);
  return ry * shoulderK(lat) + (lat <= ROAD_HALF ? 0.05 : 0);
}
// 最近帧(局部提示搜索; 连续移动只需窗口内查, 丢失才全局)
function routeNearest(x, z, hint) {
  let best = -1, bd = Infinity;
  const dist2 = i => { const p = FR[i].p; return (p[0] - x) * (p[0] - x) + (p[2] - z) * (p[2] - z); };
  if (hint >= 0) {
    for (let o = -30; o <= 30; o++) {
      const i = (hint + o + FR.length) % FR.length, dd = dist2(i);
      if (dd < bd) { bd = dd; best = i; }
    }
    if (bd < 900) return best;          // 30u 内命中即可信
  }
  for (let i = 0; i < FR.length; i++) {
    const dd = dist2(i);
    if (dd < bd) { bd = dd; best = i; }
  }
  return best;
}
// 中央车道虚线(InstancedMesh, 每帧一根)
{
  const dashGeo = new THREE.PlaneGeometry(0.3, 3);
  dashGeo.rotateX(-Math.PI / 2);
  const dashes = new THREE.InstancedMesh(dashGeo, lambert(0xffffff), FR.length);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), E = new THREE.Euler(),
        S1 = new THREE.Vector3(1, 1, 1), P = new THREE.Vector3();
  FR.forEach((f, i) => {
    E.set(0, Math.atan2(f.f[0], f.f[2]), 0);
    Q.setFromEuler(E);
    P.set(f.p[0], f.p[1] + 0.06, f.p[2]);
    M.compose(P, Q, S1);
    dashes.setMatrixAt(i, M);
  });
  dashes.instanceMatrix.needsUpdate = true;
  scenery.add(dashes);
}
// 围栏(白柱+红杆), 路缘两侧
{
  const posts = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.9, 6), lambert(0xf2f2f2), FR.length * 2);
  const M = new THREE.Matrix4();
  let n = 0;
  const edgePts = [[], []];
  FR.forEach((f, i) => {
    const r = latRight(f.f);
    for (const side of [1, -1]) {
      const x = f.p[0] + r[0] * ROAD_HALF * side, z = f.p[2] + r[1] * ROAD_HALF * side;
      edgePts[side === 1 ? 0 : 1].push(new THREE.Vector3(x, f.p[1] + 0.55, z));
      if (i % 2 === 0) { M.setPosition(x, f.p[1] + 0.45, z); posts.setMatrixAt(n++, M); }
    }
  });
  posts.instanceMatrix.needsUpdate = true;
  for (const pts of edgePts) {
    pts.push(pts[0].clone());
    scenery.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), pts.length * 2, 0.05, 5, true),
      lambert(0xcc4433)));
  }
  scenery.add(posts);
}
// 散布安全检查: 距整条路线(所有帧)的最近水平距离, 防止装饰物压到折叠回来的另一段路
function clearOfRoad(x, z, minDist) {
  let bd = Infinity;
  for (let i = 0; i < FR.length; i++) {
    const q = FR[i].p, dd = (q[0] - x) * (q[0] - x) + (q[2] - z) * (q[2] - z);
    if (dd < bd) bd = dd;
    if (bd < minDist * minDist) return false;
  }
  return bd >= minDist * minDist;
}

// 出生点/朝向 = 官方路线首帧
const SPAWN = { x: FR[0].p[0], z: FR[0].p[2], heading: Math.atan2(FR[0].f[0], FR[0].f[2]) };
// 起点门架(视觉地标)
{
  const f = FR[4], r = latRight(f.f);
  const postGeo = new THREE.CylinderGeometry(0.15, 0.15, 7, 8);
  const postMat = lambert(0xd8dde2);
  for (const side of [1, -1]) {
    const post = new THREE.Mesh(postGeo, postMat);
    post.position.set(f.p[0] + r[0] * 9.5 * side, f.p[1] + 3.5, f.p[2] + r[1] * 9.5 * side);
    scenery.add(post);
  }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(19.6, 0.5, 0.5), lambert(0xcc4433));
  bar.position.set(f.p[0], f.p[1] + 7, f.p[2]);
  bar.rotation.y = Math.atan2(r[0], r[1]) + Math.PI / 2;
  scenery.add(bar);
}
// 树: 沿路线两侧随机散布
{
  let seed = 7;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const spots = [];
  FR.forEach((f, i) => {
    if (i % 2) return;
    const r = latRight(f.f);
    const off = (rnd() < 0.5 ? 1 : -1) * (15 + rnd() * 150);
    const x = f.p[0] + r[0] * off, z = f.p[2] + r[1] * off;
    const gy = f.p[1] * shoulderK(off);
    if (Math.abs(x - SPAWN.x) < 40 && Math.abs(z - SPAWN.z) < 50) return;
    if (!clearOfRoad(x, z, 13)) return;   // 不得压路(含另一段折叠路)
    spots.push([x, gy, z, 0.8 + rnd() * 0.9]);
  });
  const trunks = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.12, 0.18, 1, 6), lambert(0x8a5a33), spots.length);
  const crowns = new THREE.InstancedMesh(
    new THREE.ConeGeometry(0.9, 2.2, 7), lambert(0x2f8d46), spots.length);
  const M = new THREE.Matrix4();
  spots.forEach(([x, gy, z, s], i) => {
    solidColliders.push({ x, z, r: 0.5 * s });
    M.makeScale(s, s, s); M.setPosition(x, gy + 0.5 * s, z); trunks.setMatrixAt(i, M);
    M.setPosition(x, gy + 2.1 * s, z); crowns.setMatrixAt(i, M);
  });
  trunks.instanceMatrix.needsUpdate = crowns.instanceMatrix.needsUpdate = true;
  scenery.add(trunks, crowns);
}
// 房屋: 沿路每 ~8 帧(80u)一座, 两侧交错
FR.forEach((f, i) => {
  if (i % 8) return;
  const k = i / 8;
  const r = latRight(f.f);
  const off = (k % 2 ? 1 : -1) * (30 + (k * 7) % 110);
  const x = f.p[0] + r[0] * off, z = f.p[2] + r[1] * off;
  const gy = f.p[1] * shoulderK(off);
  const w = 3 + k % 3, d = 2.5 + k % 2, h = 1.6;
  if (!clearOfRoad(x, z, Math.max(w, d) / 2 + 3)) return;   // 不得压路
  solidColliders.push({ x, z, r: Math.max(w, d) / 2 + 0.2 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lambert(k % 2 ? 0xe8ddc0 : 0xd9a066));

  if (mixer) mixer.update(dt);
  // ---- 驾驶更新 ----
  drive.time += dt;
  const accel = 6, maxSpeed = 9, boostMax = 20, steerRate = 3;
  const up = keys['ArrowUp'] || keys['w'], down = keys['ArrowDown'] || keys['s'];
  const left = keys['ArrowLeft'] || keys['a'], right = keys['ArrowRight'] || keys['d'];
  drive.boost = drive.state !== 0 && drive.speed > 0.5;   // 喷气中(供火焰/速度表灯)
  // 官方物理: kartspec id=1(cotton1) 真实数值 —— 力/质量 + 二次阻力, 无硬顶
  const OFFICIAL = { mass: 100, forwardAccel: 2160, backwardAccel: 1775, airFriction: 3,
                     dragFactor: 0.75, gripBrake: 2070, boostAccelFactor: 1.494, steerConstraint: 22.25 };
  if (drive.model === 'official') {
    let a = 0;
    if (up) {
      const boostMul = drive.state === 3 ? OFFICIAL.boostAccelFactor

      else a -= OFFICIAL.backwardAccel / OFFICIAL.mass;                  // 倒车推力
    }

  const steerTarget = left ? 1 : right ? -1 : 0;
  drive.steer += (steerTarget - drive.steer) * Math.min(1, 8 * dt);
  // 官方: 高速转向衰减 exp(-|v|/steerConstraint); 测试: 线性起步
  const steerEff = drive.model === 'official'
    ? Math.exp(-Math.abs(drive.speed) / OFFICIAL.steerConstraint)
    : Math.min(1, Math.abs(drive.speed) / 4);
  if (Math.abs(drive.speed) > 0.1)
    drive.heading += drive.steer * steerRate * dt * steerEff;
  // 车移动(数据空间 z-up -> 用一个地面 Group 载具: kart 已在 zup_root 下, 直接动 kartRoot)
  if (kartRoot && Math.abs(drive.speed) > 0.02) {
    // zup_root 内 +Y 是车头; 世界(呈现)移动沿 heading
    kartRoot.position.x += Math.sin(drive.heading) * drive.speed * dt;
    kartRoot.position.z += Math.cos(drive.heading) * drive.speed * dt;
    kartRoot.rotation.y = drive.heading;
  }
  // 碰撞检测(障碍柱, 距离 <1.1)
  if (kartRoot) for (const ob of obstacles) {
    const dx = kartRoot.position.x - ob.position.x;
    const dz = kartRoot.position.z - ob.position.z;
    if (dx * dx + dz * dz < 1.2 && Math.abs(drive.speed) > 2) {
      drive.crashUntil = drive.time + 0.5;                      // f47 强碰撞 0.5s
      drive.speed = -drive.speed * 0.3;
      kartRoot.position.x += dx * 0.3; kartRoot.position.z += dz * 0.3;
    }
  }
  // 空格跳跃(CS式: 起跳后越围栏, 落地恢复碰撞); airY = 离地高
  if (kartRoot) {
    if (keys[' '] && drive.vy === 0 && drive.airY <= 0) drive.vy = 6;
    if (drive.vy !== 0 || drive.airY > 0) {
      drive.vy -= 18 * dt;
      drive.airY = Math.max(0, drive.airY + drive.vy * dt);
      if (drive.airY === 0) drive.vy = 0;
    }
  }
  // 路线围栏碰撞: 只阻止"地面穿越"(上一帧与这一帧 |lat| 在路缘 10.4 两侧则弹回),
  // 路外可自由走动不抽风; 空格跳起(离地>0.9)可跨越
  if (kartRoot) {
    const p = kartRoot.position;
    const ni = routeNearest(p.x, p.z, drive.routeHint);
    drive.routeHint = ni;
    const fr = FR[ni], r = latRight(fr.f);
    const lat = (p.x - fr.p[0]) * r[0] + (p.z - fr.p[2]) * r[1];
    if (drive.airY < 0.9) {
      const dNow = Math.abs(lat), dPrev = Math.abs(drive.prevLat);
      if (Number.isFinite(dPrev) && (dNow > 10.4) !== (dPrev > 10.4)) {
        p.x = drive.prevX; p.z = drive.prevZ;
        drive.speed *= -0.3;
      }
    }
    drive.prevX = p.x; drive.prevZ = p.z;
    drive.prevLat = lat;
    // 地面高程跟随: 路面/堤岸/草地
    p.y = routeGroundY(p.x, p.z, ni) + drive.airY;
    // 场景碰撞体(树/房, 全高度实体): 圆近似推挤
    for (const c of solidColliders) {
      const dx = p.x - c.x, dz = p.z - c.z, rr = c.r + 0.6;
      const d2 = dx * dx + dz * dz;
      if (d2 < rr * rr && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        p.x = c.x + dx / d * rr; p.z = c.z + dz / d * rr;
        drive.speed *= -0.3;
      }
    }
  }
  // ---- 状态机(用户确认的动画含义) ----
  // f40=直行循环, f41/f42=左转/右转pose, f43/f44=左/右倒车固定姿态
  // f45/f46=倒车向后看过渡(播完→自动切f43/f44), f47=强碰撞
  // f51=喷火后仰, f52=甩水雷, f53=被水雷攻击, f49=胜利, f50=失败
  // 加载保护: 模型未就绪前跳过状态机,避免 TypeError 拦断后续 renderer.render()
  if (animSel.value === 'auto' && window.__setCharAnim) {
    let st, once = false;
    const isReverse = drive.speed < 0;
    if (drive.boost) { st = 'f51'; once = true; }
    else if (drive.crashUntil > drive.time) {
      st = 'f47'; once = true;
    } else if (isReverse) {
      // 倒车配对: 左=f43(过渡)→f46(固定pose), 右=f44(过渡)→f45(固定pose)
      const isLeft = drive.steer >= -0.3;
      const transClip = isLeft ? 'f43' : 'f44';
      const poseClip = isLeft ? 'f46' : 'f45';
      if (drive.reversePhase === 'none') {
        window.__setCharAnim(transClip, false, true);
        drive.reversePhase = 'transition';
        drive.reverseDir = isLeft ? 'left' : 'right';
        st = transClip; once = true;
      } else if (drive.reversePhase === 'transition') {
        const newDir = isLeft ? 'left' : 'right';
        if (newDir !== drive.reverseDir) {
          window.__setCharAnim(transClip, false, true);
          drive.reverseDir = newDir;
          st = transClip; once = true;
        } else {
          const clips = window.__daoAnim;
          const tc = clips && clips.find(a => a.name === transClip);
          const ta = tc && mixer ? mixer.existingAction(tc) : null;
          if (ta && ta.time >= tc.duration - 0.01) {
            drive.reversePhase = 'pose';
            window.__setCharAnim(poseClip, false, true);
            st = poseClip; once = true;
          } else {
            st = transClip; once = true;
          }
        }
      } else {
        const newDir = isLeft ? 'left' : 'right';
        if (newDir !== drive.reverseDir) {
          window.__setCharAnim(transClip, false, true);
          drive.reversePhase = 'transition';
          drive.reverseDir = newDir;
          st = transClip; once = true;
        } else {
          st = poseClip; once = true;
        }
      }
    } else {
      drive.reversePhase = 'none';
      if (drive.steer > 0.3)        { st = 'f41'; once = true; }  // 左转pose
      else if (drive.steer < -0.3)  { st = 'f42'; once = true; }  // 右转pose
      else st = 'f40';                                            // 直行循环
    }
    window.__setCharAnim(st, true, once);
  }
  // 火焰随喷火
  const firing = drive.boost;
  flames.forEach((f, i) => {
    f.visible = firing;
    if (firing) f.scale.setScalar(0.8 + 0.4 * Math.sin(drive.time * 30 + i));
  });
  if (parts.balloon && kartRoot) {
    balloonT += dt;
    // 官方 balloon_ani(cycleMode=0 单次): 0..1.4s 缓升 0.375->0.481,
    // 1.4..3.1s 回落落定 0.481->0.381; 之后仅轻微残余抖动
    let lift;
    const KZ = [[0,0.375],[333,0.387],[500,0.399],[633,0.412],[766,0.425],
                [866,0.435],[966,0.446],[1100,0.458],[1233,0.470],[1400,0.481],
                [2100,0.470],[2233,0.458],[2366,0.446],[2466,0.435],[2566,0.425],
                [2666,0.415],[2800,0.402],[2933,0.391],[3100,0.381]];
    const tm = Math.min(balloonT * 1000, 3100);
    let i = 0; while (i < KZ.length - 1 && KZ[i + 1][0] < tm) i++;
    const f = KZ[i + 1] ? (tm - KZ[i][0]) / (KZ[i + 1][0] - KZ[i][0]) : 0;
    lift = KZ[i][1] + (KZ[i + 1][1] - KZ[i][1]) * f;
    if (balloonT * 1000 >= 3100) lift = 0.381 + 0.008 * Math.sin(balloonT * 7); // 轻微残余
    // 目标点(车的后上方, kartRoot 局部) —— 气球带惯性: 弹簧跟随, 跑得越快越拖后
    const speedK = Math.min(Math.abs(drive.speed) / 20, 1);
    const target = new THREE.Vector3(0, 1.15 - 0.5 * speedK, 1.8 + (lift - 0.38) * 2);
    if (!window.__balloonPos) window.__balloonPos = target.clone();
    const bp = window.__balloonPos;
    // 弹簧-阻尼(欠阻尼 -> 有拖拽感)
    const stiffness = 6, damping = 3.5;
    const force = new THREE.Vector3().subVectors(target, bp).multiplyScalar(stiffness);
    if (!window.__balloonVel) window.__balloonVel = new THREE.Vector3();
    const vel = window.__balloonVel;
    vel.addScaledVector(force, dt);
    vel.multiplyScalar(1 - damping * dt);
    // 严格限定: 速度/位置硬钳制, 杜绝弹簧抽风(上天入地)
    if (vel.length() > 3) vel.setLength(3);
    bp.addScaledVector(vel, dt);
    bp.x = Math.min(0.6, Math.max(-0.6, bp.x));
    bp.y = Math.min(1.4, Math.max(0.5, bp.y));
    bp.z = Math.min(2.4, Math.max(1.2, bp.z));
    parts.balloon.position.copy(bp);
    // 绳: 锚点 -> 气球底
    const a = window.__anchor, b = parts.balloon.position;
    const dir = new THREE.Vector3().subVectors(b, a);
    window.__rope.scale.set(1, dir.length(), 1);
    window.__rope.position.copy(a).addScaledVector(dir, 0.5);
    window.__rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
      dir.normalize());
  }
  if (kartRoot) {
    mainAngle = (mainAngle + dt * (+speedEl.value)) % (Math.PI * 2);
    const steerRot = rotZ((+steerEl.value) * 3);
    const apply = (o, rot) => {
      if (!baseMats.has(o)) baseMats.set(o, o.matrix.clone());
      o.matrix.copy(rot).multiply(baseMats.get(o));
      o.matrixAutoUpdate = false;
      o.matrixWorldNeedsUpdate = true;
    };
    if (handleChild) apply(handleChild, steerRot);
    const spin = rotX(mainAngle);
    wheelChildren.forEach((w, i) => {
      if (w) apply(w, (i < 2) ? steerRot.clone().multiply(spin) : spin);
    });
  }
  // 视角更新
  if (kartRoot) {
    const p = kartRoot.position, f = drive.heading;
    if (camMode === 'follow') {
      // 原版追逐: 相机锁定车头方向, 位于车尾后上方, 转弯跟着转
      const cp = Math.cos(followCam.pitch), y = followCam.yawOff + f;
      const desired = new THREE.Vector3(
        p.x - Math.sin(y) * cp * followCam.dist,
        p.y + Math.sin(followCam.pitch) * followCam.dist,
        p.z - Math.cos(y) * cp * followCam.dist);
      camera.position.lerp(desired, 1 - Math.exp(-8 * dt));
      controls.target.lerp(new THREE.Vector3(p.x, p.y + 1.2, p.z), 1 - Math.exp(-10 * dt));
      camera.lookAt(controls.target);
    } else if (camMode === 'cockpit') {
      // 驾驶位(头盔式): 注视点钉在车前, 相机随注视点一起平移(保持用户鼠标偏移)
      const prev = controls.target.clone();
      controls.target.lerp(new THREE.Vector3(p.x + Math.sin(f) * 8, 1.4, p.z + Math.cos(f) * 8), 0.25);
      camera.position.add(controls.target.clone().sub(prev));
    } else if (camMode === 'top') {
      controls.target.lerp(new THREE.Vector3(p.x, 0, p.z), 0.1);
    }
    // free: 不动
  }
  controls.update();
  updateTacho();
  sfxEngine(drive.speed);   // 引擎音自节流(64ms), 不能放进有 key 缓存的 updateTacho
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
