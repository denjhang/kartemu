<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车+人完全体 - 板车 + 皮蛋 + 挂件</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #202530; }
  #ui { position: fixed; left: 12px; top: 12px; color: #fff; font: 13px/1.7 monospace;
        text-shadow: 0 1px 2px #000; user-select: none; }
  input { vertical-align: middle; }
  label { margin-right: 10px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="info">加载中…</div>
  <div>转向 <input id="steer" type="range" min="-1" max="1" step="0.01" value="0">
       <span id="steerV">0.00</span>
       车速 <input id="speed" type="range" min="0" max="30" step="0.5" value="8"></div>
  <div>
    <label><input type="checkbox" id="cb-rider" checked>人物(f46驾驶)</label>
    <label><input type="checkbox" id="cb-camera" checked>头戴摄像机</label>
    <label><input type="checkbox" id="cb-goggle" checked>风镜</label>
    <label><input type="checkbox" id="cb-balloon" checked>气球</label>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202530);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
window.__cam = camera; window.__controls = controls; window.__scene = scene;

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.0));
scene.add(new THREE.GridHelper(8, 32, 0x556, 0x334));

const rotX = a => new THREE.Matrix4().makeRotationX(a);
const rotZ = a => new THREE.Matrix4().makeRotationZ(a);

let kartRoot, rekart, handleChild, wheelChildren = [], mainAngle = 0;
let mixer = null, accMixer = null;
const parts = {};
window.__parts = parts;

function innerRoot(g) { return g.scene.getObjectByName('zup_root').children[0]; }
function findByName(root, name) {
  let hit = null;
  root.traverse(o => { if (!hit && o.name === name) hit = o; });
  return hit;
}

Promise.all([
  new GLTFLoader().loadAsync('kart/kart.gltf'),
  new GLTFLoader().loadAsync('character/dao.gltf'),
  new GLTFLoader().loadAsync('acc/headcamera.gltf'),
  new GLTFLoader().loadAsync('acc/goggle.gltf'),
  new GLTFLoader().loadAsync('acc/balloon.gltf'),
]).then(([kart, dao, cam, gog, bal]) => {
  [kart, dao, cam, gog, bal].forEach(g =>
    g.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; }));
  scene.add(kart.scene);
  kartRoot = kart.scene;
  rekart = kart.scene.getObjectByName('ReKart');
  const kids = rekart.children;
  handleChild = kids[1].children[0];
  wheelChildren = [2, 3, 4, 5].map(i => kids[i].children[0]);

  const charRoot = dao.scene.getObjectByName('char_root');
  kids[6].add(charRoot);
  mixer = new THREE.AnimationMixer(charRoot);
  const f46 = dao.animations.find(a => a.name === 'f46');
  if (f46) mixer.clipAction(f46).play();
  parts.rider = charRoot;

  const hp = findByName(charRoot, 'headPhone');
  if (hp) { const c = innerRoot(cam); hp.add(c); parts.camera = c; }
  const g0 = findByName(charRoot, 'goggle0');
  if (g0) { const gnode = innerRoot(gog); g0.add(gnode); parts.goggle = gnode; }

  const w2 = kids[4], w3 = kids[5];
  const t2 = new THREE.Vector3().setFromMatrixPosition(w2.matrix);
  const t3 = new THREE.Vector3().setFromMatrixPosition(w3.matrix);
  const balloonNode = new THREE.Group();
  balloonNode.name = 'balloon';
  balloonNode.matrix.makeTranslation((t2.x + t3.x) / 2, (t2.y + t3.y) / 2, (t2.z + t3.z) / 2);
  balloonNode.matrixAutoUpdate = false;
  balloonNode.matrixWorldNeedsUpdate = true;
  rekart.add(balloonNode);
  const bnode = innerRoot(bal);
  balloonNode.add(bnode);
  // 细黑绳(视觉近似, 官方资产未含绳模型): 锚点 -> 气球底(浮动最低点 z≈0.37)
  const rope = new THREE.Mesh(
    new THREE.CylinderGeometry(0.006, 0.006, 0.4, 6),
    new THREE.MeshBasicMaterial({ color: 0x111111 }));
  rope.position.set(0, 0, 0.2);
  balloonNode.add(rope);
  // 官方 balloon_ani: PrsTontroller z 0.37..0.81 上下浮动(1400ms 循环)
  accMixer = new THREE.AnimationMixer(balloonNode);
  if (bal.animations[0]) accMixer.clipAction(bal.animations[0]).play();
  parts.balloon = bnode;

  const box = new THREE.Box3().setFromObject(kart.scene);
  const ctr = box.getCenter(new THREE.Vector3());
  controls.target.copy(ctr);
  camera.position.set(ctr.x + 2.4, ctr.y + 1.6, ctr.z + 3.4);
  controls.update();
  document.getElementById('info').textContent =
    '完全体就绪: 板车(绿漆+号牌) + 皮蛋(f46) + 头戴摄像机 + 风镜 + 气球';
}).catch(e => {
  document.getElementById('info').textContent = '加载失败: ' + e.message;
  console.error(e);
});

const steerEl = document.getElementById('steer');
const speedEl = document.getElementById('speed');
steerEl.oninput = () => document.getElementById('steerV').textContent =
  (+steerEl.value).toFixed(2);
for (const [id, key] of [['cb-rider', 'rider'], ['cb-camera', 'camera'],
                          ['cb-goggle', 'goggle'], ['cb-balloon', 'balloon']]) {
  document.getElementById(id).onchange = e => {
    if (parts[key]) parts[key].visible = e.target.checked;
  };
}

const baseMats = new Map();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (accMixer) accMixer.update(dt);
  if (kartRoot) {
    mainAngle = (mainAngle + dt * (+speedEl.value)) % (Math.PI * 2);
    const steerRot = rotZ((+steerEl.value) * 3);
    const apply = (o, rot) => {
      if (!baseMats.has(o)) baseMats.set(o, o.matrix.clone());
      o.matrix.copy(rot).multiply(baseMats.get(o));
      o.matrixAutoUpdate = false;
      o.matrixWorldNeedsUpdate = true;
    };
    if (handleChild) apply(handleChild, steerRot);
    const spin = rotX(mainAngle);
    wheelChildren.forEach((w, i) => {
      if (w) apply(w, (i < 2) ? steerRot.clone().multiply(spin) : spin);
    });
  }
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
