<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>车+人完全体 - 板车 + 皮蛋 + 挂件</title>
<style>
  html, body { margin: 0; overflow: hidden; background: #202530; }
  #ui { position: fixed; left: 12px; top: 12px; color: #fff; font: 13px/1.7 monospace;
        text-shadow: 0 1px 2px #000; user-select: none; }
  input { vertical-align: middle; }
  label { margin-right: 10px; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./lib/three/build/three.module.js",
    "three/addons/": "./lib/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="info">加载中…</div>
  <div>转向 <input id="steer" type="range" min="-1" max="1" step="0.01" value="0">
       <span id="steerV">0.00</span>
       车速 <input id="speed" type="range" min="0" max="30" step="0.5" value="8"></div>
  <div>
    <label><input type="checkbox" id="cb-rider" checked>人物(f40驾驶)</label>
    <label><input type="checkbox" id="cb-camera" checked>头戴摄像机</label>
    <label><input type="checkbox" id="cb-goggle" checked>风镜</label>
    <label><input type="checkbox" id="cb-balloon" checked>气球</label>
    <label>视角
      <label><input type="radio" name="cam" value="follow" checked>跟随</label>
      <label><input type="radio" name="cam" value="cockpit">驾驶位</label>
      <label><input type="radio" name="cam" value="top">俯视</label>
      <label><input type="radio" name="cam" value="free">自由</label>
    </label>
    <label>人物动作 <select id="anim-sel">
      <option value="auto" selected>自动(随驾驶状态)</option>
      <option value="f40">f40 直行骑乘循环 1.37s</option>
      <option value="f41">f41 左转pose 34ms</option>
      <option value="f42">f42 右转pose 1ms</option>
      <option value="f43">f43 左倒车过渡 34ms</option>
      <option value="f44">f44 右倒车过渡 34ms</option>
      <option value="f45">f45 右倒车固定pose 0.33s</option>
      <option value="f46">f46 左倒车固定pose 0.33s</option>
      <option value="f47">f47 强碰撞 0.53s</option>
      <option value="f48">f48 小碰撞 0.17s</option>
      <option value="f49">f49 胜利 3.0s</option>
      <option value="f50">f50 失败 1.2s</option>
      <option value="f51">f51 喷火后仰 1ms</option>
      <option value="f52">f52 甩水雷 0.5s</option>
      <option value="f53">f53 被水雷攻击 3.3s</option>
      <option value="f54">f54 托腮 1ms</option>
      <option value="f10">f10 站立 2.0s</option>
      <option value="f11">f11 走路 0.67s</option>
    </select></label>
  <div style="color:#9ab">↑↓ 油门/倒车 · ←→ 转向 · Ctrl 喷火(N2O) · R 回出生点</div>
  </div>
</div>
<script>
// 环境守卫(file:// 直开时浏览器禁止加载模型/模块, 先于 module 检查)
if (location.protocol === 'file:') {
  document.getElementById('info').innerHTML =
    '<b style="color:#f66">打开方式错误</b>: 不能直接双击打开本文件, 请在地址栏访问 ' +
    '<b>http://localhost:8000/kart.html</b> (先运行 python web/serve.py)';
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
window.__cam = camera; window.__controls = controls; window.__scene = scene;

// ---- 视角选择: 各模式只驱动 controls.target(注视点), 机位始终可鼠标调整 ----
let camMode = 'follow';
// 跟随模式: 相机锁定车头方向(原版语义), 鼠标拖动只改相对偏移(相对车尾的方位角/俯仰/距离)
const followCam = { yawOff: 0, pitch: 0.38, dist: 7.5 };
let followDrag = null;
renderer.domElement.addEventListener('mousedown', e => {
  if (camMode === 'follow') followDrag = { x: e.clientX, y: e.clientY };
});
addEventListener('mouseup', () => followDrag = null);
addEventListener('mousemove', e => {
  if (camMode !== 'follow' || !followDrag) return;
  followCam.yawOff -= (e.clientX - followDrag.x) * 0.005;   // 拖左→绕到左侧
  followCam.pitch = Math.min(1.25, Math.max(0.05,
    followCam.pitch + (e.clientY - followDrag.y) * 0.005));
  followDrag = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('wheel', e => {
  if (camMode === 'follow')
    followCam.dist = Math.min(20, Math.max(3, followCam.dist * Math.exp(e.deltaY * 0.001)));
}, { passive: true });

document.querySelectorAll('input[name=cam]').forEach(r => r.onchange = e => {
  if (!e.target.checked) return;
  camMode = e.target.value;
  controls.enabled = camMode !== 'follow';   // 跟随模式自己接管相机
  if (!kartRoot) return;
  const p = kartRoot.position, f = drive.heading;   // 前向 = (sin f, cos f)
  if (camMode === 'cockpit') {
    camera.position.set(p.x + Math.sin(f) * 0.5, 2.35, p.z + Math.cos(f) * 0.5);
    controls.target.set(p.x + Math.sin(f) * 8, 1.4, p.z + Math.cos(f) * 8);
  } else if (camMode === 'top') {
    camera.position.set(p.x, 25, p.z + 0.01);
    controls.target.set(p.x, 0, p.z);
  } else if (camMode === 'free') {
    controls.target.set(p.x, 1, p.z);
  }
  if (camMode === 'follow') Object.assign(followCam, { yawOff: 0, pitch: 0.38, dist: 7.5 });
  else controls.update();
});

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.0));
// 草绿地面
const groundMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshBasicMaterial({ color: 0x5aa843 }));
groundMesh.rotation.x = -Math.PI / 2;
groundMesh.position.y = -0.02;
scene.add(groundMesh);
// 无限远网格(Shader)
const gridMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.ShaderMaterial({
    vertexShader: `varying vec3 vWP; void main(){vec4 w=modelMatrix*vec4(position,1.);vWP=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader: `
      varying vec3 vWP;
      void main(){
        vec2 c=vWP.xz/2.;
        vec2 g=abs(fract(c-.5)-.5)/fwidth(c);
        float l=min(g.x,g.y);
        float a=1.-min(l,1.);
        float d=length(vWP.xz);
        float fade=1.-smoothstep(60.,200.,d);
        gl_FragColor=vec4(vec3(.08,.28,.06),min(a*.95*fade,1.));
      }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
  }));
gridMesh.rotation.x = -Math.PI / 2;
gridMesh.position.y = -0.01;
scene.add(gridMesh);

// ---- 测试场景装饰: 跑道/车道线/围栏/树/房屋/远山 (程序化生成) ----
const scenery = new THREE.Group();
scene.add(scenery);
const lambert = c => new THREE.MeshLambertMaterial({ color: c });
// 圆角矩形闭环路径(XZ 平面, Vector2 = (x,z))
function loopPath(hw, hh, r) {
  const path = new THREE.CurvePath();
  const L = (x1, z1, x2, z2) => path.add(
    new THREE.LineCurve(new THREE.Vector2(x1, z1), new THREE.Vector2(x2, z2)));
  const C = (cx, cz, a0, a1) => path.add(new THREE.EllipseCurve(cx, cz, r, r, a0, a1, false));
  L(-hw + r, -hh, hw - r, -hh); C(hw - r, -hh + r, -Math.PI / 2, 0);
  L(hw, -hh + r, hw, hh - r);   C(hw - r, hh - r, 0, Math.PI / 2);
  L(hw - r, hh, -hw + r, hh);   C(-hw + r, hh - r, Math.PI / 2, Math.PI);
  L(-hw, hh - r, -hw, -hh + r); C(-hw + r, -hh + r, Math.PI, Math.PI * 1.5);
  return path;
}
// 跑道(外圈 100x60, 内圈 76x36, 路宽 12)
{
  const shapeOf = pts => {
    const s = new THREE.Shape();
    s.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) s.lineTo(pts[i].x, pts[i].y);
    s.closePath();
    return s;
  };
  const outer = shapeOf(loopPath(50, 30, 10).getSpacedPoints(200));
  outer.holes.push(new THREE.Path(loopPath(38, 18, 4).getSpacedPoints(200).reverse()));
  const road = new THREE.Mesh(new THREE.ShapeGeometry(outer), lambert(0x3a3f44));
  road.rotation.x = -Math.PI / 2;
  scenery.add(road);
  // 中央车道虚线
  const dashGeo = new THREE.PlaneGeometry(0.25, 2.2);
  dashGeo.rotateX(-Math.PI / 2);
  const dashMat = lambert(0xffffff);
  const cl = loopPath(44, 24, 7).getSpacedPoints(240);
  for (let i = 0; i < cl.length; i += 2) {
    const nxt = cl[(i + 1) % cl.length];
    const dash = new THREE.Mesh(dashGeo, dashMat);
    dash.position.set(cl[i].x, 0.01, cl[i].y);
    dash.rotation.y = Math.atan2(nxt.x - cl[i].x, nxt.y - cl[i].y);
    scenery.add(dash);
  }
}
// 围栏(白色立柱 + 红色横杆), 跑道两侧
function fence(p2d) {
  const pts3 = p2d.getSpacedPoints(280).map(v => new THREE.Vector3(v.x, 0, v.y));
  const rail = new THREE.Mesh(
    new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts3.filter((_, i) => i % 4 === 0), true),
      240, 0.05, 5, true),
    lambert(0xcc4433));
  rail.position.y = 0.55;
  const n = Math.floor(pts3.length / 4);
  const posts = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.05, 0.05, 0.9, 6), lambert(0xf2f2f2), n);
  const M = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    M.setPosition(pts3[i * 4].x, 0.45, pts3[i * 4].z);
    posts.setMatrixAt(i, M);
  }
  posts.instanceMatrix.needsUpdate = true;
  scenery.add(rail, posts);
}
fence(loopPath(56.5, 36.5, 13));
fence(loopPath(31.5, 11.5, 3));
// 树(内场 + 外围环带, 固定种子随机)
{
  let seed = 7;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const spots = [];
  for (let i = 0; i < 120 && spots.length < 70; i++) {
    let x, z;
    if (rnd() < 0.25) { x = (rnd() - 0.5) * 56; z = (rnd() - 0.5) * 16; }   // 内场
    else { const a = rnd() * Math.PI * 2, d = 62 + rnd() * 70; x = Math.cos(a) * d; z = Math.sin(a) * d; }
    if (Math.hypot(x, z) < 8) continue;                                     // 出生地留空
    if ([[6, 4], [-5, 6], [3, -6], [-7, -3]].some(([ox, oz]) => Math.hypot(x - ox, z - oz) < 2)) continue;
    spots.push([x, z, 0.8 + rnd() * 0.9]);
  }
  const trunks = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.12, 0.18, 1, 6), lambert(0x8a5a33), spots.length);
  const crowns = new THREE.InstancedMesh(
    new THREE.ConeGeometry(0.9, 2.2, 7), lambert(0x2f8d46), spots.length);
  const M = new THREE.Matrix4();
  spots.forEach(([x, z, s], i) => {
    M.makeScale(s, s, s); M.setPosition(x, 0.5 * s, z); trunks.setMatrixAt(i, M);
    M.setPosition(x, 2.1 * s, z); crowns.setMatrixAt(i, M);
  });
  trunks.instanceMatrix.needsUpdate = crowns.instanceMatrix.needsUpdate = true;
  scenery.add(trunks, crowns);
}
// 房屋(墙体方盒 + 四棱锥顶)
[[62, 0, 0.3], [-62, 10, -0.4], [40, 44, 1.2], [-40, -44, -1.8],
 [70, -25, 2.5], [-70, 25, -2.2], [10, 48, 0], [-12, -48, 3.1]].forEach(([x, z, rot], i) => {
  const w = 3 + i % 3, d = 2.5 + i % 2, h = 1.6;
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lambert(i % 2 ? 0xe8ddc0 : 0xd9a066));
  body.position.y = h / 2;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.72, 1.1, 4), lambert(0xa04030));
  roof.position.y = h + 0.55; roof.rotation.y = Math.PI / 4;
  const g = new THREE.Group();
  g.add(body, roof);
  g.position.set(x, 0, z); g.rotation.y = rot;
  scenery.add(g);
});
// 远处山脉(大锥体环)
for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2 + (i % 3) * 0.12;
  const d = 190 + (i * 37) % 90;
  const h = 45 + (i * 23) % 45;
  const m = new THREE.Mesh(new THREE.ConeGeometry(h * 0.9, h, 5), lambert(0x6f8560));
  m.position.set(Math.cos(a) * d, h / 2 - 2, Math.sin(a) * d);
  m.rotation.y = i;
  scenery.add(m);
}

const rotX = a => new THREE.Matrix4().makeRotationX(a);
const rotZ = a => new THREE.Matrix4().makeRotationZ(a);

// ---- 键盘驾驶(官方状态机语义: L2882/f0/fd) ----
const keys = {};
addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key.startsWith('Arrow') || e.key === 'Control') e.preventDefault();
  if (e.key === 'r' || e.key === 'R') {
    if (kartRoot) {
      kartRoot.position.set(0, kartRoot.position.y, 0);
      kartRoot.rotation.y = 0;
      drive.heading = 0; drive.speed = 0; drive.steer = 0;
      window.__balloonPos && window.__balloonPos.set(0, 1.15, 1.8);
      window.__balloonVel && window.__balloonVel.set(0, 0, 0);
    }
  }
});
addEventListener('keyup', e => { keys[e.key] = false; });
const drive = { speed: 0, steer: 0, heading: 0, boost: false, crashUntil: 0, time: 0, reversePhase: 'none' };

let kartRoot, rekart, handleChild, wheelChildren = [], mainAngle = 0;
let mixer = null, accMixer = null, balloonT = 0, balloonNodeRef = null;
let flames = [], obstacles = [];
const parts = {};
window.__parts = parts;

function innerRoot(g) { return g.scene.getObjectByName('zup_root').children[0]; }
function findByName(root, name) {
  let hit = null;
  root.traverse(o => { if (!hit && o.name === name) hit = o; });
  return hit;
}

Promise.all([
  new GLTFLoader().loadAsync('kart/kart.gltf'),
  new GLTFLoader().loadAsync('character/dao.gltf'),
  new GLTFLoader().loadAsync('acc/headcamera.gltf'),
  new GLTFLoader().loadAsync('acc/goggle.gltf'),
  new GLTFLoader().loadAsync('acc/balloon.gltf'),
]).then(([kart, dao, cam, gog, bal]) => {
  [kart, dao, cam, gog, bal].forEach(g =>
    g.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; }));
  scene.add(kart.scene);
  kartRoot = kart.scene;
  rekart = kart.scene.getObjectByName('ReKart');
  const kids = rekart.children;
  handleChild = kids[1].children[0];
  wheelChildren = [2, 3, 4, 5].map(i => kids[i].children[0]);

  const charRoot = dao.scene.getObjectByName('char_root');
  kids[6].add(charRoot);
  mixer = new THREE.AnimationMixer(charRoot);
  let curAction = null, curName = '';
  window.__setCharAnim = (name, soft, loopOnce) => {
    if (soft && name === curName) return;
    curName = name;
    const clip = dao.animations.find(a => a.name === name);
    if (!clip) return;
    const action = mixer.clipAction(clip);
    if (loopOnce) {
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
    } else {
      action.setLoop(THREE.LoopRepeat);
      action.clampWhenFinished = false;
    }
    action.reset().play();
    if (curAction && curAction !== action) {
      // 补间仅用于左/右转 pose(其余硬切, 避免倒车状态机时序被 0.16s 淡入干扰)
      if (name === 'f41' || name === 'f42')
        action.crossFadeFrom(curAction, 0.16, false);
      else
        curAction.stop();
    }
    curAction = action;
  };
  // f40 直行循环
  window.__setCharAnim('f40');
  parts.rider = charRoot;
  window.__charRoot = charRoot;
  window.__daoAnim = dao.animations;

  const hp = findByName(charRoot, 'headPhone');
  if (hp) { const c = innerRoot(cam); hp.add(c); parts.camera = c; }
  const g0 = findByName(charRoot, 'goggle0');
  if (g0) { const gnode = innerRoot(gog); g0.add(gnode); parts.goggle = gnode; }

  // 官方 o0(): balloon 锚点 = wheel2/wheel3 父节点平移中点。
  // 圆气球浮在人物头顶上方约半头处(模型 z 0..1.03, 球心取 1.55),
  // 上下浮动按官方 balloon_ani 节奏(1400ms, ±0.2);细绳连回锚点(视觉近似)。
  const t2 = new THREE.Vector3().setFromMatrixPosition(kids[4].matrix);
  const t3 = new THREE.Vector3().setFromMatrixPosition(kids[5].matrix);
  window.__anchor = new THREE.Vector3((t2.x + t3.x) / 2, (t2.y + t3.y) / 2, (t2.z + t3.z) / 2);
  // 悬浮圆气球: 挂在后上方(球底 z=1.8, 头顶+半头以上), y 越过车尾, 不遮车牌
  const balloonNode = new THREE.Group();
  balloonNode.name = 'balloon';
  balloonNode.position.set(0, 1.15, 1.8);
  rekart.add(balloonNode);
  balloonNode.add(innerRoot(bal));
  // 细绳: 从后轮锚点斜拉到气球底, 每帧随浮动更新
  window.__rope = new THREE.Mesh(
    new THREE.CylinderGeometry(0.006, 0.006, 1, 6),
    new THREE.MeshBasicMaterial({ color: 0x111111 }));
  rekart.add(window.__rope);
  balloonT = 0;
  parts.balloon = balloonNode;

  // 喷火(fire0 排气口: 车尾), 官方 booster 语义: 加速期火焰持续
  flames = [];
  for (const fx of [-0.28, 0.28]) {
    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(0.07, 0.5, 8, 1, true),
      new THREE.MeshBasicMaterial({ color: 0xff8822, transparent: true,
        opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false,
        side: THREE.DoubleSide }));
    flame.rotation.x = Math.PI / 2;          // 沿 -Y(车尾)喷射
    flame.position.set(fx, -0.95, 0.35);     // 数据空间: 车尾 y<0
    flame.visible = false;
    rekart.add(flame);
    flames.push(flame);
  }
  // 障碍柱(碰撞测试)
  obstacles = [];
  const obsMat = new THREE.MeshNormalMaterial();
  for (const [ox, oz] of [[6, 4], [-5, 6], [3, -6], [-7, -3]]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.6, 10), obsMat);
    post.position.set(ox, 0.8, oz);
    scene.add(post);
    obstacles.push(post);
  }

  const box = new THREE.Box3().setFromObject(kart.scene);
  const ctr = box.getCenter(new THREE.Vector3());
  camera.position.set(ctr.x, ctr.y + 3.5, ctr.z - 9);
  camera.lookAt(ctr);
  document.getElementById('info').textContent =
    '完全体就绪: 板车(绿漆+号牌) + 皮蛋(自动状态机) + 头戴摄像机 + 风镜 + 气球';
}).catch(e => {
  document.getElementById('info').textContent = '加载失败: ' + e.message;
  console.error(e);
});

const steerEl = document.getElementById('steer');
const speedEl = document.getElementById('speed');
steerEl.oninput = () => document.getElementById('steerV').textContent =
  (+steerEl.value).toFixed(2);
const animSel = document.getElementById('anim-sel');
animSel.onchange = () => {
  if (animSel.value !== 'auto')
    window.__setCharAnim && window.__setCharAnim(animSel.value);
};
for (const [id, key] of [['cb-rider', 'rider'], ['cb-camera', 'camera'],
                          ['cb-goggle', 'goggle'], ['cb-balloon', 'balloon']]) {
  document.getElementById(id).onchange = e => {
    if (parts[key]) parts[key].visible = e.target.checked;
  };
}

const baseMats = new Map();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  // ---- 驾驶更新 ----
  drive.time += dt;
  const accel = 6, maxSpeed = 9, boostMax = 20, steerRate = 3;
  const up = keys['ArrowUp'] || keys['w'], down = keys['ArrowDown'] || keys['s'];
  const left = keys['ArrowLeft'] || keys['a'], right = keys['ArrowRight'] || keys['d'];
  drive.boost = !!keys['Control'] && drive.speed > 0.5;
  const cap = drive.boost ? boostMax : maxSpeed;
  if (up) drive.speed = Math.min(drive.speed + accel * dt, cap);
  else if (down) drive.speed = Math.max(drive.speed - accel * 0.7 * dt, -4);
  else {
    drive.speed *= (1 - 1.2 * dt);
    // 惰行小速度直接刹停(指数衰减只趋近0, 不清零会持续蠕动看似自动倒车)
    if (Math.abs(drive.speed) < 0.15) drive.speed = 0;
  }
  const steerTarget = left ? 1 : right ? -1 : 0;
  drive.steer += (steerTarget - drive.steer) * Math.min(1, 8 * dt);
  if (Math.abs(drive.speed) > 0.1)
    drive.heading += drive.steer * steerRate * dt * Math.sign(drive.speed) *
      Math.min(1, Math.abs(drive.speed) / 4) * (drive.speed > 0 ? 1 : -1);
  // 车移动(数据空间 z-up -> 用一个地面 Group 载具: kart 已在 zup_root 下, 直接动 kartRoot)
  if (kartRoot && Math.abs(drive.speed) > 0.02) {
    // zup_root 内 +Y 是车头; 世界(呈现)移动沿 heading
    kartRoot.position.x += Math.sin(drive.heading) * drive.speed * dt;
    kartRoot.position.z += Math.cos(drive.heading) * drive.speed * dt;
    kartRoot.rotation.y = drive.heading;
  }
  // 碰撞检测(障碍柱, 距离 <1.1)
  if (kartRoot) for (const ob of obstacles) {
    const dx = kartRoot.position.x - ob.position.x;
    const dz = kartRoot.position.z - ob.position.z;
    if (dx * dx + dz * dz < 1.2 && Math.abs(drive.speed) > 2) {
      drive.crashUntil = drive.time + 0.5;                      // f47 强碰撞 0.5s
      drive.speed = -drive.speed * 0.3;
      kartRoot.position.x += dx * 0.3; kartRoot.position.z += dz * 0.3;
    }
  }
  // ---- 状态机(用户确认的动画含义) ----
  // f40=直行循环, f41/f42=左转/右转pose, f43/f44=左/右倒车固定姿态
  // f45/f46=倒车向后看过渡(播完→自动切f43/f44), f47=强碰撞
  // f51=喷火后仰, f52=甩水雷, f53=被水雷攻击, f49=胜利, f50=失败
  // 加载保护: 模型未就绪前跳过状态机,避免 TypeError 拦断后续 renderer.render()
  if (animSel.value === 'auto' && window.__setCharAnim) {
    let st, once = false;
    const isReverse = drive.speed < 0;
    if (drive.boost) { st = 'f51'; once = true; }
    else if (drive.crashUntil > drive.time) {
      st = 'f47'; once = true;
    } else if (isReverse) {
      // 倒车配对: 左=f43(过渡)→f46(固定pose), 右=f44(过渡)→f45(固定pose)
      const isLeft = drive.steer >= -0.3;
      const transClip = isLeft ? 'f43' : 'f44';
      const poseClip = isLeft ? 'f46' : 'f45';
      if (drive.reversePhase === 'none') {
        window.__setCharAnim(transClip, false, true);
        drive.reversePhase = 'transition';
        drive.reverseDir = isLeft ? 'left' : 'right';
        st = transClip; once = true;
      } else if (drive.reversePhase === 'transition') {
        const newDir = isLeft ? 'left' : 'right';
        if (newDir !== drive.reverseDir) {
          window.__setCharAnim(transClip, false, true);
          drive.reverseDir = newDir;
          st = transClip; once = true;
        } else {
          const clips = window.__daoAnim;
          const tc = clips && clips.find(a => a.name === transClip);
          const ta = tc && mixer ? mixer.existingAction(tc) : null;
          if (ta && ta.time >= tc.duration - 0.01) {
            drive.reversePhase = 'pose';
            window.__setCharAnim(poseClip, false, true);
            st = poseClip; once = true;
          } else {
            st = transClip; once = true;
          }
        }
      } else {
        const newDir = isLeft ? 'left' : 'right';
        if (newDir !== drive.reverseDir) {
          window.__setCharAnim(transClip, false, true);
          drive.reversePhase = 'transition';
          drive.reverseDir = newDir;
          st = transClip; once = true;
        } else {
          st = poseClip; once = true;
        }
      }
    } else {
      drive.reversePhase = 'none';
      if (drive.steer > 0.3)        { st = 'f41'; once = true; }  // 左转pose
      else if (drive.steer < -0.3)  { st = 'f42'; once = true; }  // 右转pose
      else st = 'f40';                                            // 直行循环
    }
    window.__setCharAnim(st, true, once);
  }
  // 火焰随喷火
  const firing = drive.boost;
  flames.forEach((f, i) => {
    f.visible = firing;
    if (firing) f.scale.setScalar(0.8 + 0.4 * Math.sin(drive.time * 30 + i));
  });
  if (parts.balloon && kartRoot) {
    balloonT += dt;
    // 官方 balloon_ani(cycleMode=0 单次): 0..1.4s 缓升 0.375->0.481,
    // 1.4..3.1s 回落落定 0.481->0.381; 之后仅轻微残余抖动
    let lift;
    const KZ = [[0,0.375],[333,0.387],[500,0.399],[633,0.412],[766,0.425],
                [866,0.435],[966,0.446],[1100,0.458],[1233,0.470],[1400,0.481],
                [2100,0.470],[2233,0.458],[2366,0.446],[2466,0.435],[2566,0.425],
                [2666,0.415],[2800,0.402],[2933,0.391],[3100,0.381]];
    const tm = Math.min(balloonT * 1000, 3100);
    let i = 0; while (i < KZ.length - 1 && KZ[i + 1][0] < tm) i++;
    const f = KZ[i + 1] ? (tm - KZ[i][0]) / (KZ[i + 1][0] - KZ[i][0]) : 0;
    lift = KZ[i][1] + (KZ[i + 1][1] - KZ[i][1]) * f;
    if (balloonT * 1000 >= 3100) lift = 0.381 + 0.008 * Math.sin(balloonT * 7); // 轻微残余
    // 目标点(车的后上方, kartRoot 局部) —— 气球带惯性: 弹簧跟随, 跑得越快越拖后
    const speedK = Math.min(Math.abs(drive.speed) / 20, 1);
    const target = new THREE.Vector3(0, 1.15 - 0.5 * speedK, 1.8 + (lift - 0.38) * 2);
    if (!window.__balloonPos) window.__balloonPos = target.clone();
    const bp = window.__balloonPos;
    // 弹簧-阻尼(欠阻尼 -> 有拖拽感)
    const stiffness = 6, damping = 3.5;
    const force = new THREE.Vector3().subVectors(target, bp).multiplyScalar(stiffness);
    if (!window.__balloonVel) window.__balloonVel = new THREE.Vector3();
    const vel = window.__balloonVel;
    vel.addScaledVector(force, dt);
    vel.multiplyScalar(1 - damping * dt);
    bp.addScaledVector(vel, dt);
    parts.balloon.position.copy(bp);
    // 绳: 锚点 -> 气球底
    const a = window.__anchor, b = parts.balloon.position;
    const dir = new THREE.Vector3().subVectors(b, a);
    window.__rope.scale.set(1, dir.length(), 1);
    window.__rope.position.copy(a).addScaledVector(dir, 0.5);
    window.__rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
      dir.normalize());
  }
  if (kartRoot) {
    mainAngle = (mainAngle + dt * (+speedEl.value)) % (Math.PI * 2);
    const steerRot = rotZ((+steerEl.value) * 3);
    const apply = (o, rot) => {
      if (!baseMats.has(o)) baseMats.set(o, o.matrix.clone());
      o.matrix.copy(rot).multiply(baseMats.get(o));
      o.matrixAutoUpdate = false;
      o.matrixWorldNeedsUpdate = true;
    };
    if (handleChild) apply(handleChild, steerRot);
    const spin = rotX(mainAngle);
    wheelChildren.forEach((w, i) => {
      if (w) apply(w, (i < 2) ? steerRot.clone().multiply(spin) : spin);
    });
  }
  // 视角更新
  if (kartRoot) {
    const p = kartRoot.position, f = drive.heading;
    if (camMode === 'follow') {
      // 原版追逐: 相机锁定车头方向, 位于车尾后上方, 转弯跟着转
      const cp = Math.cos(followCam.pitch), y = followCam.yawOff + f;
      const desired = new THREE.Vector3(
        p.x - Math.sin(y) * cp * followCam.dist,
        p.y + Math.sin(followCam.pitch) * followCam.dist,
        p.z - Math.cos(y) * cp * followCam.dist);
      camera.position.lerp(desired, 1 - Math.exp(-8 * dt));
      controls.target.lerp(new THREE.Vector3(p.x, p.y + 1.2, p.z), 1 - Math.exp(-10 * dt));
      camera.lookAt(controls.target);
    } else if (camMode === 'cockpit') {
      // 驾驶位(头盔式): 注视点钉在车前, 相机随注视点一起平移(保持用户鼠标偏移)
      const prev = controls.target.clone();
      controls.target.lerp(new THREE.Vector3(p.x + Math.sin(f) * 8, 1.4, p.z + Math.cos(f) * 8), 0.25);
      camera.position.add(controls.target.clone().sub(prev));
    } else if (camMode === 'top') {
      controls.target.lerp(new THREE.Vector3(p.x, 0, p.z), 0.1);
    }
    // free: 不动
  }
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
